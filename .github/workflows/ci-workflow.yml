name: Animal Shelter CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_REPOSITORY }}:${{ github.sha }}

    steps:
      # Task 4 - Checkout
      - name: Checkout repository
        uses: actions/checkout@v6

      # Task 5 - Build Docker image
      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME" .

      # Task 6 - Run Pylint
      - name: Run Linter
        run: docker run --rm "$IMAGE_NAME" python -m pylint .

      # Task 7 - Run Pytest
      - name: Run Tests
        run: docker run --rm "$IMAGE_NAME" python -m pytest tests

      # Task 8 - Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Task 8 - Push Docker image
      - name: Push to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE_NAME"
